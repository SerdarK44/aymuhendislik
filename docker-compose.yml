services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aymuhendislik-app:latest
    container_name: aymuhendislik_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # SQLite Veritabanı Kalıcı Depolama
      - ./data:/app/data
      # Admin Panelinden Yüklenen Medyalar
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
